/*
Player groups configuration file
---------------------------------

Custom configuration for ragna server with player commands
*/

groups: (
{
	id: 0 /* group 0 is the default group for every new account */
	name: "Player"
	level: 0
	inherit: ( /*empty list*/ )
	commands: {
		/* Custom player commands */
		kill: true
		commands: true
		help: true
		rates: true
		showdelay: true
		exp: true
		mobinfo: true
		iteminfo: true
		whodrops: true
		time: true
		jailtime: true
		showexp: true
		showzeny: true
		whereis: true
		autotrade: true
		noks: true
		itemlist: true
		/* Duel commands */
		duel: true
		invite: true
		accept: true
		reject: true
		leave: true
	}
	permissions: {
		/* without this basic permissions regular players could not trade or party */
		can_trade: true
		can_party: true
		attendance: true
	}
},
{
	id: 10
	name: "Support GM"
	level: 10
	inherit: ( "Player" )
	commands: {
		/* Observation - watch players invisibly */
		hide: true
		disguise: true
		undisguise: true
		/* Movement - quick travel for investigations */
		speed: true
		warp: true
		mapmove: true
		go: true
		jumpto: true
		goto: true
		/* Player info - find players and coordinates */
		where: true
		who: true
		who2: true
		who3: true
		users: true
		mapinfo: true
		/* Enforcement - deal with bots/rulebreakers */
		jail: true
		unjail: true
		kick: true
		mute: true
		unmute: true
		/* Utility */
		mobinfo: true
		iteminfo: true
		whodrops: true
		time: true
		/* NPC/coordinate helpers */
		npcmove: true
		tonpc: true
	}
	log_commands: true
	permissions: {
		can_trade: true
		can_party: true
		any_warp: true
	}
},
{
	id: 99
	name: "Admin"
	level: 99
	inherit: ( /*empty list*/ )
	commands: {
		/* not necessary due to all_commands: true */
	}
	log_commands: true
	permissions: {
		can_trade: true
		can_party: true
		command_enable: true
		all_skill: false
		all_equipment: false
		skill_unconditional: false
		use_check: true
		use_changemaptype: true
		all_commands: true
		channel_admin: true
		can_trade_bounded: true
		item_unconditional: false
		bypass_stat_onclone: true
		bypass_max_stat: true
		/* all_permission: true */
	}
}
)
